version: '3.8'

services:
  rabbitmq:
    image: "rabbitmq:management"
    ports:
      - 15080:15672  # Interfaz de administración (Web)
      - 5000:5672    # Puerto de conexión de RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: "postgres:13"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: Estafeta,13
      POSTGRES_DB: kata_tasks
    ports:
      - 6000:5432  # Puerto de conexión de PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: "adminer"
    ports:
      - "8080:8080"  # Puerto para acceder a Adminer
    depends_on:
      - postgres


volumes:
  rabbitmq_data:
  postgres_data:
